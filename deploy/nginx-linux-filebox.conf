# FileBox — mainfile.emanstore.ir -> 127.0.0.1:3950 (کانتینر /opt/filebox)
#
# گواهی: certbot (webroot /var/www/html)، تمدید خودکار با reload.
#
# proxy_request_buffering off: بدون آن nginx کل بدنه‌ی آپلود را اول روی دیسک
# بافر می‌کند و مصرف دیسک در لحظه دو برابر می‌شود.

upstream filebox_app {
    server 127.0.0.1:3950;
    keepalive 16;
}

server {
    listen 80;
    server_name mainfile.emanstore.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mainfile.emanstore.ir;

    ssl_certificate     /etc/letsencrypt/live/mainfile.emanstore.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mainfile.emanstore.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # هم‌تراز با MAX_FILE_MB برنامه
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 2048m;
    client_body_timeout  600s;

    location / {
        proxy_pass http://filebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # دانلود و زیپ از گیت‌هاب استریم می‌شوند؛ بافر پاسخ خاموش
    location ~ ^/api/(download|view|zip) {
        proxy_pass http://filebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 1800s;
    }
}
