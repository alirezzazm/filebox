# mainfile.emanstore.ir — FileBox (Node/Express روی 127.0.0.1:3600)
# این فایل نباید BOM داشته باشد؛ nginx با BOM بالا نمی‌آید.
#
# نکته‌ی مهم درباره‌ی آپلود:
# proxy_request_buffering off است تا nginx بدنه‌ی درخواست را روی دیسک
# بافر نکند. با فقط ~۷ گیگ فضای آزاد، بافر شدن یک فایل بزرگ یعنی دو برابر
# شدن مصرف دیسک در لحظه‌ی آپلود.

upstream filebox_app {
    server 127.0.0.1:3600;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name mainfile.emanstore.ir;

    # win-acme چالش‌ها را اینجا می‌نویسد
    location /.well-known/acme-challenge/ {
        root C:/nginx/acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://filebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size    2048m;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }
}

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         mainfile.emanstore.ir;

    ssl_certificate     C:/nginx/certs/mainfile.emanstore.ir-chain.pem;
    ssl_certificate_key C:/nginx/certs/mainfile.emanstore.ir-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # سقف هر فایل هم‌تراز با MAX_FILE_MB برنامه
    client_max_body_size    2048m;
    client_body_timeout     600s;

    location / {
        proxy_pass http://filebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # بدون بافر شدن روی دیسک — با ~۷ گیگ فضای آزاد حیاتی است
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # دانلود و زیپ ممکن است طولانی باشد؛ بافر پاسخ خاموش تا استریم شود
    location ~ ^/api/(download|view|zip) {
        proxy_pass http://filebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 1800s;
    }
}
