services:
  filebox:
    build: .
    container_name: filebox
    restart: unless-stopped
    # ------------------------------------------------------------------
    # اینجا مشخص می‌شود روی چه لوکال‌هاستی بالا می‌آید:
    #   http://localhost:8080
    # فقط روی 127.0.0.1 باز است تا از بیرون شبکه خانگی دیده نشود؛
    # دسترسی از اینترنت فقط از طریق تانل کلادفلر انجام می‌شود.
    # اگر خواستی از گوشی داخل شبکه خانه هم باز شود: "8080:8080"
    # ------------------------------------------------------------------
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data          # همه فایل‌ها و دیتابیس اینجا می‌ماند
    environment:
      PORT: 8080
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-123}
      UPLOAD_PASSWORD: ${UPLOAD_PASSWORD:-}
      MAX_FILE_MB: ${MAX_FILE_MB:-2048}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      STORAGE_QUOTA_GB: ${STORAGE_QUOTA_GB:-5}
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-2}
      # ذخیره روی گیت‌هاب — اگر خالی باشند فقط روی همین سرور ذخیره می‌شود
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_QUOTA_GB: ${GITHUB_QUOTA_GB:-20}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      DB_SYNC_SECONDS: ${DB_SYNC_SECONDS:-20}
      TZ: Asia/Tehran
    # موقع توقف، آخرین تغییرات db.json به ریپو فرستاده می‌شود (تا ۱۰ ثانیه)
    stop_grace_period: 20s

  # ------------------------------------------------------------------
  # تانل کلادفلر — با: docker compose --profile tunnel up -d
  # اول توی داشبورد Cloudflare > Zero Trust > Networks > Tunnels
  # یک تانل بساز، توکنش را در فایل .env بگذار و
  # Public hostname آن را به http://filebox:8080 وصل کن.
  # ------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: filebox-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - filebox
